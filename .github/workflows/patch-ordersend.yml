name: One-time OrderSend patch

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/patch-trigger.txt'

permissions:
  contents: write

jobs:
  patch-ordersend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove OrderCheck preflight from OrderSend wrapper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('MQL5/Experts/GoldReaper/The Gold Reaper OderSend v4.5.mq5')
          data = path.read_bytes()

          start_marker = b'   // Broker-side preflight. Weekly session metadata may still show OPEN on a\n'
          keep_marker = b'   bool ok=::OrderSend(request,result);\n'
          guard_marker = b'   bool precheck_ok=::OrderCheck(request,precheck);\n'

          if data.count(guard_marker) != 1:
              raise SystemExit(f'Expected exactly one OrderSend precheck guard, found {data.count(guard_marker)}')

          start = data.find(start_marker)
          if start < 0:
              raise SystemExit('OrderCheck preflight start marker not found')

          keep = data.find(keep_marker, start)
          if keep < 0:
              raise SystemExit('OrderSend call after preflight not found')

          path.write_bytes(data[:start] + data[keep:])
          print('Removed OrderCheck preflight; MT4TradeSessionOpen gate is unchanged.')
          PY

      - name: Commit patched EA to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'MQL5/Experts/GoldReaper/The Gold Reaper OderSend v4.5.mq5'
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No change to commit.'
            exit 0
          fi
          git commit -m 'Remove OrderCheck preflight from OrderSend'
          git push origin HEAD:main
